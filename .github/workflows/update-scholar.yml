name: Update Google Scholar Metrics

on:
  schedule:
    # Run every Sunday at 6:35 AM UTC (non-congested time to avoid being skipped)
    - cron: '35 6 * * 0'
  workflow_dispatch: # Allow manual one-click trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch Google Scholar data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python scripts/update_scholar.py

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: auto-update Google Scholar metrics"
          title: "chore: auto-update Google Scholar metrics"
          body: "This PR was automatically generated by GitHub Actions to update Google Scholar metrics in `_data/scholar.yml`."
          branch: auto-update-scholar
          base: source
          delete-branch: true
          add-paths: _data/scholar.yml

      - name: Auto-merge Pull Request
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}" || echo "Auto-merge not enabled on repository; PR remains open for review."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
