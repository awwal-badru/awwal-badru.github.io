name: Update Google Scholar Metrics

on:
  schedule:
    # Run every Sunday at 6:35 AM UTC (non-congested time to avoid being skipped)
    - cron: '35 6 * * 0'
  workflow_dispatch: # Allow manual one-click trigger from Actions tab

permissions:
  contents: write
  actions: write

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch Google Scholar data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python scripts/update_scholar.py

      - name: Commit and push changes
        id: commit_and_push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _data/scholar.yml
          if git diff --staged --quiet; then
            echo "No changes detected in _data/scholar.yml."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: auto-update Google Scholar metrics [skip ci]"
            git push origin source
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Jekyll Deployment
        if: steps.commit_and_push.outputs.changed == 'true'
        run: |
          gh workflow run jekyll.yml --ref source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
