<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ site.google_tag_manager }}"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<nav class="navbar sticky-top navbar-expand-lg navbar-dark glass-navbar">
  <div class="container d-flex align-items-center">
    <a class="navbar-brand d-flex align-items-center" href="{{ '/' | relative_url }}">
      <img src="{{ '/favicon.ico' | relative_url }}" alt="" width="32" height="32" style="margin-right:.75rem;" class="brand-logo">
      <span class="brand-text">{{ site.title | escape }}</span>
    </a>

    <!-- Fix: BS5 uses data-bs-toggle and data-bs-target -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <!-- Fix: align items using ml-auto -->
      <ul class="navbar-nav ml-auto text-center mt-3 mt-lg-0 pt-2 pt-lg-0 align-items-center">
        <li class="nav-item"><a class="nav-link" href="{{ '/' | relative_url }}">Home</a></li>
        {% for page in site.nav_pages %}
          <li class="nav-item"><a class="nav-link" href="{{ '/' | append: page.name | append: '/' | relative_url }}">{{ page.name | capitalize }}</a></li>
        {% endfor %}
        <li class="nav-item d-flex align-items-center justify-content-center">
          <button id="theme-toggle" class="btn btn-link nav-link" style="border: none; padding: 0.4rem 0.65rem !important; cursor: pointer; display: flex; align-items: center; text-decoration: none;" aria-label="Toggle theme">
            <i class="fa fa-moon-o" id="theme-toggle-icon" style="font-size: 1.15rem;"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggleBtn = document.getElementById('theme-toggle');
  const toggleIcon = document.getElementById('theme-toggle-icon');
  
  if (!toggleBtn || !toggleIcon) return;
  
  function updateToggleIcon(theme) {
    if (theme === 'dark') {
      toggleIcon.classList.remove('fa-moon-o');
      toggleIcon.classList.add('fa-sun-o');
    } else {
      toggleIcon.classList.remove('fa-sun-o');
      toggleIcon.classList.add('fa-moon-o');
    }
  }

  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  updateToggleIcon(currentTheme);

  toggleBtn.addEventListener('click', function() {
    const activeTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
    
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    updateToggleIcon(newTheme);
  });
});
</script>
